<!doctype html>
<html><head><meta charset="utf-8"><title>Recording self-test</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
  button { font-size: 1rem; padding: 0.5rem 1rem; }
  table { border-collapse: collapse; margin-top: 1rem; width: 100%; }
  td, th { border: 1px solid #ccc; padding: 6px 10px; text-align: left; font-size: 0.9rem; }
  .pass { background: #e6f6e6; }
  .fail { background: #fbe3e3; }
  #status { margin-top: 1rem; color: #555; }
</style></head><body>
<h1>Recording self-test</h1>
<p>Verifies that this browser delivers every signal the session
recorder relies on. Opens two probe tabs for a few seconds, then
closes them. Don't interact with the browser while it runs.</p>
<button id="run">Run self-test</button>
<div id="status"></div>
<table id="results" hidden><thead><tr><th>Signal</th><th>Result</th><th>Detail</th></tr></thead><tbody></tbody></table>
<script src="diagnostics.js"></script>
</body></html>
